services:
  desktop:
    build: ./desktop
    environment:
      DEMO_VNC_PASSWORD: ${DEMO_VNC_PASSWORD:?Run python3 setup.py first}
  guacd:
    image: registry-1.docker.io/guacamole/guacd:1.6.0
  guacamole:
    image: registry-1.docker.io/guacamole/guacamole:1.6.0
    depends_on: [guacd]
    environment:
      GUACD_HOSTNAME: guacd
      SECRET_KEY: ${JWT_SECRET_KEY:?Run python3 setup.py first}
    volumes:
      - ./guacamole/extensions/guacamole-auth-jwt-1.6.0.jar:/etc/guacamole/extensions/guacamole-auth-jwt-1.6.0.jar:ro
      - ./guacamole/guacamole.properties:/etc/guacamole/guacamole.properties:ro
      - ./guacamole/logback.xml:/etc/guacamole/logback.xml:ro
  broker:
    build: ./backend
    depends_on: [guacamole]
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run python3 setup.py first}
      DEMO_ACCESS_TOKEN: ${DEMO_ACCESS_TOKEN:?Run python3 setup.py first}
      DEMO_VNC_PASSWORD: ${DEMO_VNC_PASSWORD:?Run python3 setup.py first}
  nginx:
    image: registry-1.docker.io/library/nginx:stable-alpine
    depends_on: [guacamole, broker]
    volumes:
      - ./frontend/build:/usr/share/nginx/html/example-app:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-8080}:80"
