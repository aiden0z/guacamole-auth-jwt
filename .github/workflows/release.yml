name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches project version
        run: |
          VERSION=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: release
      - name: Checksum verified artifact
        working-directory: release
        run: sha256sum *.jar > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
