name: Verify
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check jar -PtestJavaVersion=${{ matrix.java }} --no-daemon
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: extension
          path: build/libs/guacamole-auth-jwt-1.6.0.jar
  integration:
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: example-app/guacamole/extensions
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: example-app/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r example-app/backend/requirements.txt
      - run: python -m unittest discover -s example-app/backend -v
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: example-app/frontend
      - run: node --test scripts/tab-isolation.test.mjs example-app/frontend/src/tunnelLifecycle.test.mjs
      - run: npm install --global agent-browser@0.33.0
      - run: agent-browser install --with-deps
      - run: python example-app/setup.py
      - run: docker compose -p jwt-ci -f example-app/docker-compose.yaml -f example-app/compose.test.yaml up -d --build
      - run: node scripts/integration.mjs
        env:
          COMPOSE_PROJECT_NAME: jwt-ci
      - run: node scripts/sharing-integration.mjs
        env:
          COMPOSE_PROJECT_NAME: jwt-ci
      - run: python scripts/browser-integration.py --output-dir browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-evidence
      - if: always()
        run: docker compose -p jwt-ci -f example-app/docker-compose.yaml down --volumes
