plugins {
    id 'java-library'
}

group = 'com.aiden0z.guacamole-auth-jwt'
version = '1.6.0'
description = 'Stateless JWT authentication for Apache Guacamole'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories { mavenCentral() }

dependencies {
    // These APIs are owned and supplied by Guacamole/Tomcat, never bundled.
    compileOnly 'org.apache.guacamole:guacamole-ext:1.6.0'
    compileOnly 'javax.servlet:servlet-api:2.5'
    compileOnly 'com.google.inject:guice:5.1.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    // Avoid adding a second Jackson stack to Guacamole's classloader.
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'
    runtimeOnly 'com.google.code.gson:gson:2.13.2'

    testImplementation 'org.apache.guacamole:guacamole-ext:1.6.0'
    testImplementation 'javax.servlet:servlet-api:2.5'
    testImplementation 'com.google.inject:guice:5.1.0'
    testImplementation 'ch.qos.logback:logback-classic:1.3.16'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

def guacamoleVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property('guacamoleVersion', guacamoleVersion)
    filesMatching('guac-manifest.json') { expand(guacamoleVersion: guacamoleVersion) }
}

tasks.named('jar') {
    // Guacamole loads dependency JARs from the root of an extension JAR.
    from(configurations.runtimeClasspath)
    from('LICENSE')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('stageExample', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar'))
    into 'example-app/guacamole/extensions'
}

tasks.named('test') {
    if (project.hasProperty('testJavaVersion')) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(project.property('testJavaVersion').toString().toInteger())
        }
    }
}
